name: Debug Infisical OIDC

on:
  workflow_dispatch:

concurrency:
  group: debug-infisical-oidc
  cancel-in-progress: false

jobs:
  test:
    name: Pull Infisical secrets via OIDC
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate required configuration
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}
          INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG }}
          INFISICAL_SECRET_PATH: ${{ vars.INFISICAL_SECRET_PATH }}
        run: |
          set -euo pipefail

          [[ -n "${INFISICAL_IDENTITY_ID}" ]] || { echo "Missing INFISICAL_IDENTITY_ID"; exit 1; }
          [[ -n "${INFISICAL_PROJECT_SLUG}" ]] || { echo "Missing INFISICAL_PROJECT_SLUG"; exit 1; }
          [[ -n "${INFISICAL_ENV_SLUG}" ]] || { echo "Missing INFISICAL_ENV_SLUG"; exit 1; }
          [[ -n "${INFISICAL_SECRET_PATH}" ]] || { echo "Missing INFISICAL_SECRET_PATH"; exit 1; }
          [[ "${INFISICAL_SECRET_PATH}" = /* ]] || { echo "INFISICAL_SECRET_PATH must start with /"; exit 1; }

          echo "Identity ID configured"
          echo "Project slug: ${INFISICAL_PROJECT_SLUG}"
          echo "Environment slug: ${INFISICAL_ENV_SLUG}"
          echo "Secret path: ${INFISICAL_SECRET_PATH}"

      - name: Pull secrets from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: "oidc"
          identity-id: "${{ vars.INFISICAL_IDENTITY_ID }}"
          project-slug: "${{ vars.INFISICAL_PROJECT_SLUG }}"
          env-slug: "${{ vars.INFISICAL_ENV_SLUG }}"
          secret-path: "${{ vars.INFISICAL_SECRET_PATH }}"

      - name: Verify action ran
        run: echo "Infisical action finished"

      - name: Assert bootstrap secrets are available
        env:
          ADMIN_SSH_AUTHORIZED_KEY: ${{ env.ADMIN_SSH_AUTHORIZED_KEY }}
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_KNOWN_HOSTS: ${{ env.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_PRIVATE_KEY: ${{ env.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_USER: ${{ env.PROD_SSH_USER }}
          TAILSCALE_AUTH_KEY: ${{ env.TAILSCALE_AUTH_KEY }}
          INFISICAL_SECRET_PATH: ${{ vars.INFISICAL_SECRET_PATH }}
        run: |
          set -euo pipefail

          [[ -n "${ADMIN_SSH_AUTHORIZED_KEY}" ]] || { echo "Missing ADMIN_SSH_AUTHORIZED_KEY after Infisical fetch from ${INFISICAL_SECRET_PATH}"; exit 1; }
          [[ -n "${PROD_HOST}" ]] || { echo "Missing PROD_HOST after Infisical fetch from ${INFISICAL_SECRET_PATH}"; exit 1; }
          [[ -n "${PROD_SSH_PRIVATE_KEY}" ]] || { echo "Missing PROD_SSH_PRIVATE_KEY after Infisical fetch from ${INFISICAL_SECRET_PATH}"; exit 1; }
          [[ -n "${TAILSCALE_AUTH_KEY}" ]] || { echo "Missing TAILSCALE_AUTH_KEY after Infisical fetch from ${INFISICAL_SECRET_PATH}"; exit 1; }

          if [[ -n "${PROD_SSH_KNOWN_HOSTS}" ]]; then
            echo "PROD_SSH_KNOWN_HOSTS configured"
          else
            echo "PROD_SSH_KNOWN_HOSTS not configured; workflows will use ssh-keyscan"
          fi

          if [[ -n "${PROD_SSH_USER}" ]]; then
            echo "PROD_SSH_USER configured"
          else
            echo "PROD_SSH_USER not configured; remote bootstrap defaults to root"
          fi

          echo "Infisical OIDC debug completed successfully."
