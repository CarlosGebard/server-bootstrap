name: Provision Tailscale Host

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to apply
        required: true
        default: main

concurrency:
  group: production-tailscale-provision
  cancel-in-progress: false

jobs:
  provision:
    name: Bootstrap and apply baseline through Tailscale
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull provision secrets from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: "oidc"
          identity-id: "${{ vars.INFISICAL_IDENTITY_ID }}"
          project-slug: "${{ vars.INFISICAL_PROJECT_SLUG }}"
          env-slug: "${{ vars.INFISICAL_ENV_SLUG }}"
          secret-path: "${{ vars.INFISICAL_SECRET_PATH }}"

      - name: Assert required Tailscale provision secrets are present
        env:
          PROD_SSH_PRIVATE_KEY: ${{ env.PROD_SSH_PRIVATE_KEY }}
          PROD_HOST: ${{ env.PROD_HOST }}
          SERVER_HOST: ${{ env.SERVER_HOST }}
          TAILSCALE_AUTH_KEY: ${{ env.TAILSCALE_AUTH_KEY }}
          TAILSCALE_SERVER_HOST: ${{ env.TAILSCALE_SERVER_HOST }}
        run: |
          set -euo pipefail

          [[ -n "${TAILSCALE_AUTH_KEY}" ]] || { echo "Missing TAILSCALE_AUTH_KEY"; exit 1; }
          [[ -n "${PROD_SSH_PRIVATE_KEY}" ]] || { echo "Missing PROD_SSH_PRIVATE_KEY"; exit 1; }
          [[ -n "${SERVER_HOST:-${TAILSCALE_SERVER_HOST:-${PROD_HOST:-}}}" ]] || { echo "Missing SERVER_HOST, TAILSCALE_SERVER_HOST, or PROD_HOST"; exit 1; }

      - name: Connect GitHub runner to Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ env.TAILSCALE_AUTH_KEY }}
        run: |
          set -euo pipefail

          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --auth-key="$TAILSCALE_AUTH_KEY" --hostname="github-actions-server-bootstrap"
          tailscale status

      - name: Install Ansible
        run: python -m pip install --upgrade pip ansible-core

      - name: Validate Ansible playbook syntax
        run: make ansible-check

      - name: Prepare SSH material
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_KNOWN_HOSTS: ${{ env.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_PORT: ${{ env.PROD_SSH_PORT }}
          PROD_SSH_PRIVATE_KEY: ${{ env.PROD_SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ env.SERVER_HOST }}
          TAILSCALE_SERVER_HOST: ${{ env.TAILSCALE_SERVER_HOST }}
        run: |
          set -euo pipefail

          ssh_host="${SERVER_HOST:-${TAILSCALE_SERVER_HOST:-${PROD_HOST}}}"
          ssh_port="${PROD_SSH_PORT:-22}"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/provision_key"
          chmod 600 "$HOME/.ssh/provision_key"

          if [[ -n "${PROD_SSH_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -T 10 -p "$ssh_port" -H "$ssh_host" >> "$HOME/.ssh/known_hosts"
          fi

          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Build bootstrap inventory
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_PORT: ${{ env.PROD_SSH_PORT }}
          PROD_SSH_USER: ${{ env.PROD_SSH_USER }}
          SERVER_HOST: ${{ env.SERVER_HOST }}
          TAILSCALE_SERVER_HOST: ${{ env.TAILSCALE_SERVER_HOST }}
        run: |
          set -euo pipefail

          ssh_host="${SERVER_HOST:-${TAILSCALE_SERVER_HOST:-${PROD_HOST}}}"

          printf '%s\n' \
            'all:' \
            '  hosts:' \
            '    bootstrap_target:' \
            "      ansible_host: ${ssh_host}" \
            "      ansible_user: ${PROD_SSH_USER:-root}" \
            "      ansible_port: ${PROD_SSH_PORT:-22}" \
            "      ansible_ssh_private_key_file: ${HOME}/.ssh/provision_key" \
            > /tmp/bootstrap-hosts.yml

      - name: Run bootstrap playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "true"
        run: |
          set -euo pipefail

          cd ansible

          ansible-playbook \
            -i /tmp/bootstrap-hosts.yml \
            playbooks/bootstrap.yml

      - name: Build host baseline inventory
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_PORT: ${{ env.PROD_SSH_PORT }}
          SERVER_HOST: ${{ env.SERVER_HOST }}
          TAILSCALE_SERVER_HOST: ${{ env.TAILSCALE_SERVER_HOST }}
        run: |
          set -euo pipefail

          ssh_host="${SERVER_HOST:-${TAILSCALE_SERVER_HOST:-${PROD_HOST}}}"

          printf '%s\n' \
            'all:' \
            '  hosts:' \
            '    runtime_target:' \
            "      ansible_host: ${ssh_host}" \
            '      ansible_user: carlos' \
            "      ansible_port: ${PROD_SSH_PORT:-22}" \
            "      ansible_ssh_private_key_file: ${HOME}/.ssh/provision_key" \
            > /tmp/runtime-hosts.yml

      - name: Run host baseline playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "true"
        run: |
          set -euo pipefail

          cd ansible

          ansible-playbook \
            -i /tmp/runtime-hosts.yml \
            playbooks/host-baseline.yml
